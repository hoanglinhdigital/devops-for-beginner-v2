# Lab 1 (bước 8): Workflow build thủ công (workflow_dispatch) hoặc được workflow khác
# gọi (workflow_call). Checkout source theo Git tag và push image với tag = version.
# Copy file này thành .github/workflows/build-docker.yml
name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag to build'
        required: true
        type: string

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: nodejs-random-color

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code (theo tag)
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ inputs.version }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push image to ECR
      run: |
        docker build -t ${{ env.ECR_REPOSITORY }}:${{ inputs.version }} .
        docker tag ${{ env.ECR_REPOSITORY }}:${{ inputs.version }} ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.version }}
        docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.version }}
