# Lab 1 (bước 5): Workflow tự động build & push khi push code lên nhánh master.
# Image được đánh tag `latest`. Copy file này thành .github/workflows/build-docker.yml
name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: nodejs-random-color

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push image to ECR
      run: |
        docker build -t ${{ env.ECR_REPOSITORY }}:latest .
        docker tag ${{ env.ECR_REPOSITORY }}:latest ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
