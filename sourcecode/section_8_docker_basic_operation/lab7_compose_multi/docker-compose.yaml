services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: compose-multi-web:1.0
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=appuser
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=testdb
      - REDIS_HOST=cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=testdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Named volume: dữ liệu MySQL được giữ lại kể cả khi container bị xoá
      - db-data:/var/lib/mysql
      # Script khởi tạo bảng & dữ liệu mẫu (chỉ chạy lần đầu khi volume rỗng)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  db-data:
