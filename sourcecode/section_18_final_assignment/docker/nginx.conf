# nginx.conf cho frontend: phục vụ file tĩnh React + proxy /api về backend.
# Copy file này vào cùng thư mục build context trước khi `docker build`.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Hỗ trợ React Router (SPA): mọi request không phải file tĩnh đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request API về backend (Spring Boot chạy port 8080).
    # Tên "backend" là DNS nội bộ; tuỳ cấu hình, có thể thay bằng ALB nội bộ của backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
