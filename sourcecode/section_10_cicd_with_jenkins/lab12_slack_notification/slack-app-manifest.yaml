# Lab 12 – Manifest tạo Slack App cho Jenkins (api.slack.com/apps -> Create New App -> From an app manifest)
# Tham khảo: https://plugins.jenkins.io/slack/ (mục "Creating your app")
display_information:
  name: Jenkins
features:
  bot_user:
    display_name: Jenkins
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:read
      - chat:write
      - chat:write.customize
      - files:write
      - reactions:write
      - users:read
      - users:read.email
      - groups:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
